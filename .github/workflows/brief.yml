name: Daily brief
on:
  schedule:            # ready by 05:30 UK all year (cron is UTC; UK = UTC in winter, UTC+1 in summer)
    - cron: "40 3 * * *"   # 03:40 UK winter / 04:40 UK summer
    - cron: "10 4 * * *"
    - cron: "40 4 * * *"
    - cron: "5 5 * * *"    # backups; later runs skip in seconds once today's brief exists
    - cron: "35 5 * * *"
    - cron: "15 6 * * *"
    - cron: "15 7 * * *"
  workflow_dispatch:
    inputs:
      force: {description: "Rebuild even if today exists", type: boolean, default: false}
permissions:
  contents: write
concurrency: {group: brief, cancel-in-progress: false}
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Already done today?
        id: check
        run: |
          T=$(TZ=Europe/London date +%F)
          if [ -f "docs/$T.html" ] && [ "${{ inputs.force }}" != "true" ]; then echo "skip=1" >> $GITHUB_OUTPUT; fi
      - uses: actions/setup-python@v5
        if: steps.check.outputs.skip != '1'
        with: {python-version: "3.12"}
      - uses: actions/setup-node@v4
        if: steps.check.outputs.skip != '1'
        with: {node-version: "22"}
      - name: Install Claude Code + image tool
        if: steps.check.outputs.skip != '1'
        run: |
          npm install -g @anthropic-ai/claude-code
          pip install --quiet pillow
      - name: Build brief
        if: steps.check.outputs.skip != '1'
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
        run: ./generate.sh ${{ inputs.force && 'force' || '' }}
      - name: Publish
        if: steps.check.outputs.skip != '1'
        run: |
          git config user.name "energy-brief-bot"
          git config user.email "actions@users.noreply.github.com"
          git add docs data
          git commit -m "Brief $(TZ=Europe/London date +%F)" || exit 0
          git push
